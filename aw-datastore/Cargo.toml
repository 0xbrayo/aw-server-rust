[package]
name = "aw-datastore"
version = "0.1.0"
authors = ["Johan Bjäreholt <johan@bjareho.lt>"]
edition = "2021"

[features]
# Default links the system libduckdb (see .cargo/config DUCKDB_LIB_DIR). Enable
# `bundled` to compile a self-contained DuckDB engine from source instead.
default = []
bundled = ["duckdb/bundled"]
# Encryption is not supported on the DuckDB backend.
legacy_import_tests = []

[dependencies]
dirs = "6"
serde = "1.0"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
duckdb = { version = "1", features = ["chrono"] }
mpsc_requests = "0.3"
log = "0.4"

aw-models = { path = "../aw-models" }
aw-transform = { path = "../aw-transform" }
regex = "1"

# SIMD-accelerated JSON parser for the hot event-read path. Only has SIMD
# backends for 64-bit x86/ARM; other targets (e.g. 32-bit ARM) fall back to
# serde_json in code, so the dependency is gated to the arches it supports.
[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
sonic-rs = "0.3"
